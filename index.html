<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MMJ Self-Coaching App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Self-coaching app for UPSC CSE, TGPSC Group-I/II/III/IV, APPSC, SSC, TG DSC/TET, engineering exams, CAT, MAT and CA: syllabus tracker, paper trends, OC cut-offs, notes at a glance, practice, planner and AI help from any AI tool.">
<meta name="theme-color" content="#2340b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..800&family=Hind:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;600&display=swap">
<style>
/* Layout: answer-booklet shell. A left index rail (desktop) or bottom tab bar (phone),
   a ruled "sheet" for content with a red margin rule, OMR bubbles for progress. */
:root {
  --paper: #f3f5f9;
  --sheet: #ffffff;
  --sheet-2: #f8f9fc;
  --ink: #141a2c;
  --ink-2: #464e66;
  --ink-3: #737b93;
  --rule: #e3e6ef;
  --rule-2: #cfd4e1;
  --accent: #2340b8;          /* ballpoint-pen blue */
  --accent-2: #1a3091;
  --accent-soft: #e8edfc;
  --on-accent: #ffffff;
  --mark: #f6d54b;            /* highlighter */
  --mark-soft: #fdf4c8;
  --on-mark: #141a2c;
  --margin: #e0747c;          /* answer-sheet margin rule */
  --good: #0ca30c;
  --good-text: #006300;
  --good-soft: #e3f4e3;
  --warn: #fab219;
  --warn-text: #8a5a00;
  --warn-soft: #fff2d6;
  --crit: #d03b3b;
  --crit-soft: #fbe6e6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --q100: #cde2fb; --q200: #9ec5f4; --q300: #6da7ec; --q400: #3987e5;
  --q500: #256abf; --q600: #184f95; --q700: #0d366b;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ht-hi: #ffffff;
  --shadow: 0 1px 2px rgba(20, 26, 44, .06), 0 4px 14px rgba(20, 26, 44, .06);
  --font-display: "Anek Latin", "Segoe UI", system-ui, sans-serif;
  --font-body: "Hind", "Noto Sans Telugu", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
  --r-sm: 6px;
  --rail-w: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d111c; --sheet: #151a28; --sheet-2: #1a2030; --ink: #e8ebf4; --ink-2: #b3b9cb; --ink-3: #8a91a8;
    --rule: #262c3f; --rule-2: #343b52; --accent: #8399f4; --accent-2: #a5b5f8; --accent-soft: #1f2846; --on-accent: #0d111c;
    --mark: #e3c23c; --mark-soft: #3a3417; --on-mark: #141a2c; --margin: #a8545b;
    --good: #0ca30c; --good-text: #3fc23f; --good-soft: #13301a; --warn: #fab219; --warn-text: #f5c35a; --warn-soft: #3a2e10;
    --crit: #e0605f; --crit-soft: #3b1a1c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --q100: #0d366b; --q200: #104281; --q300: #184f95; --q400: #1c5cab; --q500: #2a78d6; --q600: #5598e7; --q700: #86b6ef;
    --grid: #2c2c2a; --axis: #383835; --ht-hi: #0b0b0b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d111c; --sheet: #151a28; --sheet-2: #1a2030; --ink: #e8ebf4; --ink-2: #b3b9cb; --ink-3: #8a91a8;
  --rule: #262c3f; --rule-2: #343b52; --accent: #8399f4; --accent-2: #a5b5f8; --accent-soft: #1f2846; --on-accent: #0d111c;
  --mark: #e3c23c; --mark-soft: #3a3417; --on-mark: #141a2c; --margin: #a8545b;
  --good: #0ca30c; --good-text: #3fc23f; --good-soft: #13301a; --warn: #fab219; --warn-text: #f5c35a; --warn-soft: #3a2e10;
  --crit: #e0605f; --crit-soft: #3b1a1c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --q100: #0d366b; --q200: #104281; --q300: #184f95; --q400: #1c5cab; --q500: #2a78d6; --q600: #5598e7; --q700: #86b6ef;
  --grid: #2c2c2a; --axis: #383835; --ht-hi: #0b0b0b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15.5px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--sheet);
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-2); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.005em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.25rem); font-weight: 750; font-stretch: 88%; }
h2 { font-size: 1.35rem; font-weight: 700; font-stretch: 92%; }
h3 { font-size: 1.08rem; font-weight: 650; }
h4 { font-size: .95rem; font-weight: 650; }
p { margin: 0; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.small { font-size: .86rem; }
.hl { background: linear-gradient(transparent 55%, var(--mark-soft) 55%); padding: 0 .1em; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto; background: var(--sheet); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 18px;
  padding-block: 22px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px;
}
.brand { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 780; font-stretch: 80%; font-size: 1.28rem; line-height: 1; }
.brand-sub { font-size: .72rem; color: var(--ink-3); letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { margin-top: 10px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
  color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: .95rem;
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: var(--sheet-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail-foot { margin-top: auto; font-size: .78rem; color: var(--ink-3); display: grid; gap: 6px; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.sync[data-mode="cloud"] i { background: var(--good); }
.sync[data-mode="saving"] i { background: var(--warn); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--sheet) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar .brand { display: none; }
.countdown { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.countdown b { font-family: var(--font-display); font-size: 1.25rem; font-weight: 780; font-stretch: 85%; color: var(--accent); }
.countdown span { color: var(--ink-2); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.search { position: relative; flex: 0 1 300px; min-width: 0; }
.search input {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: 999px; border: 1px solid var(--rule-2);
  background: var(--sheet-2);
}
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--ink-3); }
.search-results {
  position: absolute; top: calc(100% + 6px); right: 0; width: min(420px, 92vw); max-height: 60vh; overflow-y: auto;
  background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r); box-shadow: var(--shadow); z-index: 50; padding: 6px;
}
.search-results a { display: block; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); }
.search-results a:hover, .search-results a:focus { background: var(--accent-soft); }
.search-results small { display: block; color: var(--ink-3); }

.view {
  width: 100%; max-width: 1180px; margin: 0 auto;
  padding-block: 26px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 26px; outline: none;
}
.view-head { display: flex; flex-direction: column; gap: 6px; }
.view-head p { color: var(--ink-2); max-width: 70ch; }
.tabbar { display: none; }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .topbar .brand { display: flex; }
  .topbar .brand-sub { display: none; }
  .search { flex: 1 1 100%; order: 5; }
  .tabbar {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    background: var(--sheet); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .tabbar a, .tabbar button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; border: 0; background: none;
    color: var(--ink-3); text-decoration: none; font-size: .7rem; font-weight: 500; cursor: pointer;
  }
  .tabbar svg { width: 21px; height: 21px; }
  .tabbar [aria-current="page"] { color: var(--accent); }
}

/* drawer (More on phones, topic detail everywhere) */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 26, .42); z-index: 60; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 61; background: var(--sheet);
  box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); }
.drawer-head h2 { flex: 1; font-size: 1.2rem; }
.drawer-body { overflow-y: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 18px; }
.drawer-body .btn { white-space: normal; text-align: left; }

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink);
  font-weight: 550; font-size: .92rem; text-decoration: none; line-height: 1.2; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--on-accent); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--sheet-2); border-color: transparent; }
.btn-sm { padding: 5px 10px; font-size: .84rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 50%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.g2 > *, .g3 > *, .g4 > * { min-width: 0; }

.sheet {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.sheet.ruled { position: relative; padding-left: 34px; }
.sheet.ruled::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 1.5px; background: var(--margin); opacity: .7; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sheet-head h2, .sheet-head h3 { min-width: 0; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 550;
  background: var(--sheet-2); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; line-height: 1.6;
}
.chip { max-width: 100%; }
.exam-card .chip, .view-head .chips .chip { white-space: normal; }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.good { background: var(--good-soft); border-color: transparent; color: var(--good-text); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn-text); }
.chip.crit { background: var(--crit-soft); border-color: transparent; color: var(--crit); }
.chip.mark { background: var(--mark-soft); border-color: transparent; color: var(--ink); }
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea, .input {
  padding: 9px 11px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--sheet); min-width: 0; width: 100%;
}
textarea { resize: vertical; line-height: 1.6; }
.field .hint { font-size: .78rem; color: var(--ink-3); }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 10px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 550; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-sm); }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t th, table.t td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t th { font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; background: var(--sheet-2); white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; color: var(--ink); }
.callout.mark { border-left-color: var(--mark); background: var(--mark-soft); }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }

.progress { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* ---------- OMR bubble (progress state 0–4) ---------- */
.omr {
  --p: 0; width: 22px; height: 22px; border-radius: 50%; flex: none; cursor: pointer; padding: 0;
  border: 1.5px solid var(--ink-3);
  background: conic-gradient(var(--accent) calc(var(--p) * 25%), transparent 0);
  background-clip: padding-box; position: relative;
}
.omr[data-s="4"] { border-color: var(--accent); }
.omr:hover { border-color: var(--accent); }
.omr-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); align-items: center; }
.omr-legend span { display: inline-flex; align-items: center; gap: 6px; }
.omr-legend .omr { width: 16px; height: 16px; cursor: default; }

/* ---------- dashboard ---------- */
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat .v { font-family: var(--font-display); font-weight: 780; font-size: 2.1rem; font-stretch: 85%; line-height: 1; }
.hero-stat .l { font-size: .84rem; color: var(--ink-2); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-weight: 750; font-size: 1.65rem; font-stretch: 88%; line-height: 1.05; }
.stat .l { font-size: .8rem; color: var(--ink-2); }
.subj-bars { display: flex; flex-direction: column; gap: 10px; }
.subj-bar { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 3.2rem; gap: 10px; align-items: center; font-size: .88rem; }
.subj-bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subj-bar .pct { text-align: right; font-family: var(--font-mono); font-size: .8rem; color: var(--ink-2); }
.week-list { display: flex; flex-direction: column; }
.topic-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--rule); min-width: 0; }
.topic-row:last-child { border-bottom: 0; }
.topic-row .tname { flex: 1; min-width: 0; cursor: pointer; }
.topic-row .tname b { font-weight: 550; display: block; }
.topic-row .tname small { color: var(--ink-3); font-size: .78rem; }
.topic-row .w { flex: none; }

/* ---------- exam explorer ---------- */
.exam-card { text-decoration: none; color: var(--ink); transition: border-color .15s; }
.exam-card:hover { border-color: var(--accent); color: var(--ink); }
.exam-card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: minmax(0, 10rem) minmax(0, 1fr); gap: 6px 14px; font-size: .9rem; }
.kv dt { color: var(--ink-3); font-weight: 550; }
.kv dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv dd { margin-bottom: 6px; } }
.stage-strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.stage { border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; background: var(--sheet-2); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stage .idx { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-3); letter-spacing: .08em; }
.paper { display: flex; justify-content: space-between; gap: 8px; font-size: .86rem; border-top: 1px dashed var(--rule-2); padding-top: 6px; }

2. **Background**: your graduation subject gives a head start (engineering, medical science, law, commerce, literature).

4. **Guidance and material** available free or affordably.

## Patterns worth knowing (CSE 2022 annual report)
- Most-taken: PSIR, Sociology, Anthropology, Geography.
- Success rates mostly 6–12%; Medical Science, Law, Economics and Hindi Literature ran higher in that year, partly because fewer, better-prepared candidates take them.

## If you are an engineer
- An engineering optional (Civil, Mechanical, Electrical) overlaps directly with ESE, GATE and TGPSC AEE preparation. AIR 1 in CSE 2023 took Electrical Engineering.
- Trade-off: the syllabus is large and scoring is less predictable than for humanities optionals.

## If you are strong in Telugu
- Telugu Literature is a legitimate option; its syllabus is fixed and your language paper and TGPSC Telugu-medium writing benefit too.`,

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const parseD = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };

  const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);

  function inline(s) {

    xt.forEach((p) => { g += `<text x="${sx(p.x)}" y="${H - 8}" text-anchor="middle">'${String(p.x).slice(2)}</text>`; });

  let aiCtl = null; let lastMcqs = null;
  async function runAI(kind, id) {
    const t = TOPIC[id]; if (!t) return;
    const area = $('#ai-area'); if (!area) return;

    const mode = AI.mode();

    box.innerHTML = `<div class="sheet-head">${mode === 'bridge' ? '' : '<span class="thinking">Thinking… (' + esc(AI.label()) + ')</span><button class="btn btn-ghost btn-sm" data-act="ai-stop">Stop</button>'}</div><div class="bridge-slot"></div><div class="md"></div>`;

    const title = { explain: 'Explain at a glance', mcq: '5 exam-style MCQs', mains: 'Mains question + outline', doubt: 'Your doubt' }[kind];
    try {
      const text = await AI.run(prompt, { area: $('.bridge-slot', box), signal: aiCtl.signal, title: title + ' — with any AI chat (free)', onText: (tx) => { if (kind !== 'mcq') out.innerHTML = md(tx); } });

  const PHASE = {

  const FOCUS = { all: 'Full syllabus', prelims: 'Prelims first (Mains-only topics later)', mains: 'Mains (skip CSAT-only topics)' };
  function buildPlan(o) {
    const weeks = Math.max(1, Math.floor((daysBetween(o.start, o.end) + 1) / 7));
    const weeklyHrs = o.wd * 5 + o.we * 2;
    const budget = weeklyHrs * 0.62; // the rest goes to current affairs, PYQs and tests
    let cov = Math.max(1, Math.round(weeks * 0.6)); let rev = weeks > 2 ? Math.max(1, Math.round(weeks * 0.25)) : 0; let mock = weeks - cov - rev;
    if (mock < 0) { mock = 0; rev = weeks - cov; }
    const tags = tagsFor(o.tracks);
    const keep = (t) => {
      if (o.skipDone && statusOf(t.id) >= 3) return false;
      if (t.opt) return true;
      const ex = (t.ex || []).filter((x) => tags.has(x));
      if (o.focus === 'prelims') return ex.some((x) => x !== 'upscm');
      if (o.focus === 'mains') return ex.some((x) => x !== 'csat');
      return true;
    };
    const topics = trackedTopics(o.tracks).filter(keep);
    const mult = o.revisionMode ? 0.45 : 1;
    const hrs = (t) => (t.h || 6) * mult;
    const optQ = topics.filter((t) => t.opt);
    const queues = SYL.map((s) => (s.units || []).map((u) => TOPIC[u.id]).filter((t) => !t.opt && topics.includes(t))).filter((q) => q.length);
    const totalH = topics.reduce((a, t) => a + hrs(t), 0);
    const scale = Math.min(1, (budget * cov) / (totalH || 1));
    const W = []; let ws = o.start;
    for (let i = 0; i < weeks; i++) { W.push({ s: ws, e: addDays(ws, 6), ph: i < cov ? 'cover' : i < cov + rev ? 'revise' : 'mock', t: [], r: [], done: false }); ws = addDays(ws, 7); }
    const perWeek = optQ.length ? Math.ceil(optQ.length / cov) : 0;
    const optDone = new Set(); let oi = 0;
    const addOpt = (w) => { if (optDone.has(w)) return 0; optDone.add(w); let h = 0; for (let k = 0; k < perWeek && oi < optQ.length; k++) { W[w].t.push(optQ[oi].id); h += hrs(optQ[oi]) * scale; oi++; } return h; };
    let qi = 0; let active = [queues[qi++], queues[qi++]].filter(Boolean); let wi = 0; let used = addOpt(0); let flip = 0; let gsCount = 0;
    while (active.length && wi < cov) {
      const q = active[flip % active.length]; flip++;
      const t = q.shift(); const h = hrs(t) * scale;
      if (used + h > budget && gsCount > 0) { wi++; if (wi >= cov) { q.unshift(t); break; } used = addOpt(wi); gsCount = 0; }
      W[wi].t.push(t.id); used += h; gsCount++;
      active = active.filter((x) => x.length);
      while (active.length < 2 && qi < queues.length) active.push(queues[qi++]);
    }
    for (let w = 0; w < cov; w++) addOpt(w);
    const leftover = active.flat().concat(queues.slice(qi).flat()).concat(optQ.slice(oi));
    if (leftover.length) { leftover.forEach((t, k) => { W[cov - 1 - (k % Math.max(1, Math.min(4, cov)))].t.push(t.id); }); }
    const subs = Array.from(new Set(topics.map((t) => t.subject)));
    let k = 0; W.forEach((w) => { if (w.ph !== 'cover') { w.r = subs.slice(k, k + Math.max(2, Math.ceil(subs.length / Math.max(1, rev)))); k += w.r.length; if (k >= subs.length) k = 0; } });
    return { tracks: o.tracks, start: o.start, end: o.end, wd: o.wd, we: o.we, focus: o.focus, revisionMode: !!o.revisionMode, scale: +scale.toFixed(2), totalH: Math.round(totalH), weeks: W, made: todayStr() };
  }

  $('#scrim').addEventListener('click', closeDrawer);
  $('#q').addEventListener('input', (e) => doSearch(e.target.value));
  $('#q').addEventListener('focus', (e) => doSearch(e.target.value));
  $('#search-results').addEventListener('click', () => { $('#search-results').hidden = true; $('#q').value = ''; });
  window.addEventListener('hashchange', route);

  /* ---------------- boot ---------------- */
  document.body.classList.add('has-ai');
  Store.load();
  CA.load();
  renderNav();
  route();
  Store.connect();
  AI.init().then(() => { if (AI.fn && current.name === 'profile') rerender(); });
  /* Only the hosted build ships sw.js (and a manifest link); the single-file copy and claude.ai do not. */
  if ('serviceWorker' in navigator && !IN_VIEWER && document.querySelector('link[rel="manifest"]') && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ });
  }
})();
</script>

</body></html>
